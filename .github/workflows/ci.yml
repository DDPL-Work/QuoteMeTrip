name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: troublefree_holiday
      DB_USER: root
      DB_PASSWORD: root
      DB_DIALECT: mysql
      DB_TEST_NAME: troublefree_holiday_test
      # Test-only auth secrets (Phase 3 integration/unit tests inject
      # fallbacks too — these make CI explicit and independent of .env).
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create databases
        run: >
          node -e "
          const mysql = require('mysql2/promise');
          (async () => {
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT),
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
            });
            for (const db of [process.env.DB_NAME, process.env.DB_TEST_NAME]) {
              await conn.query(\`CREATE DATABASE IF NOT EXISTS \\\`\${db}\\\`;\`);
            }
            await conn.end();
          })();"

      - name: Prepare test database
        run: npm run db:test:prepare --workspace=@troublefree/backend

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
