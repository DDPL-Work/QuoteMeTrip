<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuoteMeTrip — Platform (Traveller · Agency · Admin)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fffbf3;
        --ink: #13291c;
        --muted: #4e5754;
        --faint: #5b6461;
        --line: #e2dcd1;
        --line2: #d5cdbf;
        --card: #fff;
        --soft: #fbf9f5;
        --accent: #a85f00;
        --teal: #147d33;
        --tealbg: #e5f2ea;
        --ok: #245a31;
        --okbg: #dcebdd;
        --warn: #8a3517;
        --warnbg: #fbe9d9;
        --amber: #6b4a12;
        --amberbg: #fff6e6;
        --dark: #0c4e28;
        --serif: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: var(--sans);
        color: var(--ink);
        background: var(--bg);
        font-size: 15px;
        line-height: 1.5;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--teal);
      }
      h1,
      h2,
      h3 {
        font-family: var(--serif);
        font-weight: 600;
        margin: 0;
        line-height: 1.15;
      }
      /* shell */
      .top {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 12px 24px;
        background: var(--dark);
        color: #fffbf3;
      }
      .logo {
        font-family: var(--serif);
        font-size: 22px;
        font-weight: 600;
        white-space: nowrap;
      }
      .logo span {
        color: #fc7c00;
      }
      .roles {
        display: flex;
        gap: 6px;
        background: #176a2e;
        padding: 4px;
        border-radius: 12px;
      }
      .roles button {
        border: 0;
        background: transparent;
        color: #cfe0d5;
        padding: 9px 16px;
        border-radius: 9px;
        font-weight: 600;
        cursor: pointer;
        min-height: 40px;
      }
      .roles button[aria-pressed='true'] {
        background: #fffbf3;
        color: var(--ink);
      }
      .top .spacer {
        flex: 1;
      }
      .statuschip {
        font-size: 13px;
        color: #cfe0d5;
      }
      .statuschip b {
        color: #fff;
      }
      .ghost-dark {
        border: 1px solid #3d7352;
        background: transparent;
        color: #fffbf3;
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        min-height: 40px;
        font-weight: 600;
      }
      .shell {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        min-height: calc(100vh - 64px);
      }
      .side {
        border-right: 1px solid var(--line);
        padding: 20px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: #f4eee2;
      }
      .side .cap {
        font-size: 12px;
        font-weight: 700;
        color: var(--faint);
        padding: 6px 12px 8px;
      }
      .side button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 11px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 500;
        min-height: 44px;
      }
      .side button:hover {
        background: #eae3d4;
      }
      .side button[aria-current='page'] {
        background: var(--card);
        font-weight: 700;
        box-shadow: 0 1px 0 var(--line);
      }
      .dot {
        min-width: 22px;
        height: 22px;
        border-radius: 999px;
        background: #fc7c00;
        color: #13291c;
        font-size: 12px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
      }
      .flow {
        margin-top: auto;
        padding: 14px 12px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
      }
      .flow ol {
        margin: 8px 0 0;
        padding-left: 18px;
      }
      .flow li.done {
        color: var(--ok);
        font-weight: 600;
      }
      .flow li.now {
        color: var(--ink);
        font-weight: 700;
      }
      main {
        padding: 32px 40px 60px;
        min-width: 0;
      }
      .wrap {
        max-width: 100%;
        margin: 0 auto;
      }
      /* primitives */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 24px;
      }
      .soft {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .between {
        justify-content: space-between;
      }
      .wrapx {
        flex-wrap: wrap;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .cols {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 36px;
        align-items: start;
      }
      .muted {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
        font-size: 13px;
      }
      label.f {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .inp {
        height: 46px;
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 0 12px;
        background: var(--soft);
        font-size: 15px;
        width: 100%;
        color: var(--ink);
      }
      textarea.inp {
        height: auto;
        padding: 12px;
        resize: vertical;
      }
      .inp:focus {
        outline: 2px solid var(--teal);
        outline-offset: 1px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 12px;
        font-weight: 700;
        border: 0;
        cursor: pointer;
        text-decoration: none;
      }
      .btn.primary {
        background: #fc7c00;
        color: #13291c;
      }
      .btn.primary:hover {
        background: #e37000;
      }
      .btn.dark {
        background: var(--dark);
        color: #fffbf3;
      }
      .btn.teal {
        background: var(--teal);
        color: #fff;
      }
      .btn.line {
        background: var(--card);
        border: 1px solid var(--line2);
        color: var(--ink);
      }
      .btn.dash {
        background: transparent;
        border: 1.5px dashed #b9ae9c;
        color: var(--ink);
      }
      .btn.sm {
        min-height: 36px;
        padding: 0 12px;
        font-size: 13px;
        border-radius: 9px;
      }
      .btn.block {
        width: 100%;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .p-ok {
        background: var(--okbg);
        color: var(--ok);
      }
      .p-warn {
        background: var(--warnbg);
        color: var(--warn);
      }
      .p-teal {
        background: var(--tealbg);
        color: var(--teal);
      }
      .p-amber {
        background: var(--amberbg);
        color: var(--amber);
      }
      .p-grey {
        background: #ece6db;
        color: var(--muted);
      }
      .stack > .pill {
        align-self: flex-start;
      }
      .tag {
        background: var(--tealbg);
        color: var(--teal);
        font-size: 13px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 8px;
      }
      .tag.off {
        background: #f1ece3;
        color: var(--muted);
      }
      .chip {
        min-height: 42px;
        padding: 0 14px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        border: 1px solid var(--line2);
        background: #fff;
        cursor: pointer;
      }
      .chip[aria-pressed='true'] {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      .note {
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 14px;
      }
      .n-amber {
        background: var(--amberbg);
        border: 1px solid #ebd3a6;
        color: var(--amber);
      }
      .n-ok {
        background: var(--okbg);
        border: 1px solid #9bc3a2;
        color: var(--ok);
      }
      .n-teal {
        background: var(--tealbg);
        color: var(--teal);
      }
      .n-warn {
        background: var(--warnbg);
        border: 1px solid #e6b9a4;
        color: var(--warn);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 12px;
        color: var(--muted);
        background: var(--soft);
        padding: 11px 14px;
        font-weight: 700;
      }
      td {
        padding: 14px;
        border-top: 1px solid #eee8de;
        vertical-align: top;
      }
      .tablewrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
      }
      .big {
        font-family: var(--serif);
        font-size: 28px;
        font-weight: 600;
      }
      .num {
        font-family: var(--serif);
        font-size: 30px;
        color: var(--accent);
        line-height: 1;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .steps li {
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 12px;
        color: var(--faint);
      }
      .steps li i {
        height: 6px;
        border-radius: 3px;
        background: var(--line2);
        display: block;
      }
      .steps li.on {
        color: var(--ink);
        font-weight: 700;
      }
      .steps li.on i {
        background: var(--teal);
      }
      .stepno {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--teal);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        flex-shrink: 0;
      }
      .stepno.off {
        background: var(--line2);
        color: var(--muted);
      }
      .day {
        display: grid;
        grid-template-columns: 70px minmax(0, 1fr) minmax(0, 1.3fr) auto 40px;
        gap: 16px;
        align-items: end;
      }
      .daynum {
        font-family: var(--serif);
        font-size: 34px;
        font-weight: 600;
        line-height: 1;
      }
      .iconbtn {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid var(--line2);
        background: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .chat {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 260px;
        overflow: auto;
        padding: 4px;
      }
      .msg {
        max-width: 80%;
        padding: 9px 12px;
        border-radius: 12px;
        font-size: 14px;
      }
      .msg.me {
        align-self: flex-end;
        background: var(--tealbg);
      }
      .msg.them {
        align-self: flex-start;
        background: #f1ece3;
      }
      .msg small {
        display: block;
        font-size: 11px;
        color: var(--faint);
        margin-top: 2px;
      }
      .stars button {
        border: 0;
        background: transparent;
        font-size: 28px;
        cursor: pointer;
        color: #c9bfae;
        padding: 0 2px;
        min-width: 40px;
        min-height: 44px;
      }
      .stars button.on {
        color: #e37000;
      }
      .darkpanel {
        background: var(--dark);
        color: #fffbf3;
        border-radius: 20px;
        padding: 26px;
      }
      .darkpanel .muted {
        color: #cfe0d5;
      }
      /* phone */
      .phone {
        width: 390px;
        min-height: 780px;
        margin: 0 auto;
        background: var(--bg);
        border: 10px solid #13291c;
        border-radius: 44px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 30px 60px -30px rgba(28, 38, 36, 0.5);
      }
      .phone .pbody {
        flex: 1;
        padding: 22px 18px 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: auto;
        max-height: 720px;
      }
      .phone h1 {
        font-size: 26px;
      }
      .ptabs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        border-top: 1px solid var(--line);
        background: #fff;
        padding: 6px 6px 12px;
      }
      .ptabs button {
        border: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        min-height: 48px;
        justify-content: center;
        cursor: pointer;
      }
      .ptabs button[aria-current='page'] {
        color: var(--accent);
        font-weight: 700;
      }
      .reqcard {
        text-align: left;
        width: 100%;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        cursor: pointer;
      }
      .reqcard[disabled] {
        cursor: default;
        opacity: 0.7;
      }
      .plancard {
        text-align: left;
        width: 100%;
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        cursor: pointer;
        background: #fff;
        border: 1px solid var(--line2);
      }
      .plancard[aria-pressed='true'] {
        border: 2px solid var(--teal);
        background: var(--tealbg);
      }
      .pbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 2px 10px;
        border-bottom: 1px solid var(--line);
      }
      .pbar .nm {
        font-weight: 700;
        font-size: 14px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .kpi {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
      }
      .kpi b {
        font-family: var(--serif);
        font-size: 22px;
        display: block;
        line-height: 1.1;
      }
      .kpi span {
        font-size: 12px;
        color: var(--faint);
      }
      .chipbar {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .chipbar button {
        border: 1px solid var(--line2);
        background: #fff;
        border-radius: 999px;
        padding: 0 14px;
        min-height: 34px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        color: var(--ink);
      }
      .chipbar button[aria-pressed='true'] {
        background: var(--dark);
        color: #fffbf3;
        border-color: var(--dark);
      }
      .todo {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #fff;
        border: 1px solid var(--line);
        border-left: 3px solid #fc7c00;
        border-radius: 12px;
        padding: 12px 14px;
        width: 100%;
        text-align: left;
        cursor: pointer;
      }
      .tl {
        display: flex;
        flex-direction: column;
        margin: 2px 0;
      }
      .tl > div {
        display: flex;
        gap: 10px;
        font-size: 13px;
        padding: 5px 0;
        color: var(--faint);
      }
      .tl > div i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line2);
        margin-top: 4px;
        flex-shrink: 0;
      }
      .tl > div.on {
        color: var(--ink);
        font-weight: 600;
      }
      .tl > div.on i {
        background: var(--teal);
      }
      .seg {
        display: flex;
        border: 1px solid var(--line2);
        border-radius: 10px;
        overflow: hidden;
      }
      .seg button {
        flex: 1;
        border: 0;
        background: #fff;
        min-height: 40px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        color: var(--ink);
      }
      .seg button[aria-pressed='true'] {
        background: var(--teal);
        color: #fff;
      }
      .ptabs button {
        position: relative;
        font-size: 10.5px;
        gap: 2px;
        padding: 0 2px;
      }
      .pbrand {
        margin: -22px -18px 12px;
        padding: 14px 16px;
        background: var(--dark);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 0 0 20px 20px;
      }
      .pbrand img {
        height: 24px;
        width: auto;
        display: block;
        flex-shrink: 0;
      }
      .pbrand .nm {
        display: block;
        font-weight: 700;
        font-size: 13.5px;
        line-height: 1.1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pbrand .sub {
        display: block;
        font-size: 11px;
        color: #bbd4c4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .phero {
        background: #fff1dc;
        border: 1px solid #f6d6a8;
        border-radius: 16px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .phero .k {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: #b45a00;
      }
      .phero b {
        font-family: var(--serif);
        font-size: 19px;
        line-height: 1.15;
      }
      .phero .d {
        font-size: 12px;
        color: var(--faint);
      }
      .kpi {
        position: relative;
        overflow: hidden;
      }
      .kpi:before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--teal);
      }
      .kpi.a:before {
        background: #fc7c00;
      }
      .kpi.b:before {
        background: var(--teal);
      }
      .kpi.c:before {
        background: #0c4e28;
      }
      .kpi.d:before {
        background: #f0a500;
      }
      .psec {
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 8px;
      }
      .todo {
        box-shadow: 0 2px 8px -6px rgba(19, 41, 28, 0.5);
      }
      .todo:hover {
        border-color: #fc7c00;
      }
      .phone {
        box-shadow: 0 34px 60px -34px rgba(19, 41, 28, 0.55);
      }
      @media (max-width: 820px) {
        .phone {
          width: 100%;
          max-width: 440px;
          border-width: 0;
          border-radius: 0;
          min-height: calc(100vh - 120px);
        }
        .phone .pbody {
          max-height: none;
          flex: 1;
        }
        .pbrand {
          border-radius: 0;
        }
      }
      .phone {
        display: flex;
        flex-direction: column;
        height: 812px;
        overflow: hidden;
      }
      .papp {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        background: var(--bg);
      }
      .phone .pbody {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 16px 18px 20px;
        max-height: none;
        gap: 12px;
      }
      .pbrand {
        margin: 0;
        border-radius: 0;
        flex-shrink: 0;
        padding: 14px 16px;
      }
      .bell {
        position: relative;
        border: 0;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
      }
      .bell i {
        position: absolute;
        top: -4px;
        right: -4px;
        background: #fc7c00;
        color: #13291c;
        font-style: normal;

      function dayTable() {

        if (!atLeast('agreed'))
          return `<div class="wrap card stack" style="max-width:640px"><h2>No agreed quote yet</h2><div class="muted">Once you agree to a quote, the payment and confirmation steps appear here.</div><button class="btn primary" data-act="go" data-page="itinerary">See quotes</button></div>`;

      function agencyGate() {

              'Itinerary updated',
              'The guest changed the plan — update your quote',

  </section>
  <div class="psec">Recent activity</div>
  ${
    S.log.length
      ? S.log

              `<div class="row" style="gap:10px;font-size:13px;align-items:flex-start"><span class="faint" style="width:86px;flex-shrink:0">${l.at}</span><span>${esc(l.text)}</span></div>`,

          .join('')
      : '<div class="faint">No activity yet.</div>'
  }`,
        );
      }
      function vRequests() {
        const g = agencyGate(),
          mine = myCurrentQuote(),
          f = S.aFilter || 'all';

        if (S.agreed != null) state = agreedIsMe() ? 'agreed' : 'closed';
        else if (mine) state = 'quoted';
        const labels = {
          new: ['NEW', 'p-warn'],
          quoted: ['QUOTED', 'p-teal'],
          agreed: ['AGREED', 'p-ok'],

        if (state === 'new' && S.version > 1) labels.new = ['UPDATED', 'p-amber'];
        const show =
          S.version > 0 &&
          !g &&
          !S.declined &&
          (f === 'all' ||
            (f === 'new' && state === 'new') ||
            (f === 'quoted' && state === 'quoted') ||
            (f === 'agreed' && (state === 'agreed' || state === 'closed')));
        const req = show

      function renderApp() {

      function setPath(path, val) {
        const ks = path.split('.');

      document.addEventListener('input', (e) => {
        const el = e.target;

        let v = el.value;
        if (el.type === 'number') v = v === '' ? '' : Number(v);
        setPath(el.dataset.bind, v);
        save();
        if (el.dataset.rerenderSide !== undefined) {
          const s = document.getElementById('summary');
          if (s) s.innerHTML = summaryHTML();
        }
        if (el.dataset.rerenderDep !== undefined) {
          S.qf.depositAmount = depositCalc();
          const d = document.getElementById('depamt');
          if (d) d.textContent = depositCalc() || '—';
          const pp = document.getElementById('perpax');
          if (pp) {
            const n = parseFloat(String(S.qf.price).replace(/[^\d.]/g, ''));
            const t = Number(S.trip.travellers) || 1;
            const sym = S.qf.currency === 'EUR' ? '€ ' : S.qf.currency === 'USD' ? '$ ' : '₺ ';
            pp.textContent = isNaN(n) ? '' : sym + Math.round(n / t) + ' per person';

        }

      document.addEventListener('change', (e) => {

          setPath(el.dataset.bind, el.value);
          save();
          render();
          return;

            S.trip.days.push({

              act: '',
              activity: false,
              guide: false,

            if (!n.name.trim() || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(n.email)) {
              toast('Enter a name and a valid corporate email');
              return;
            }
            S.agencies.push({
              id: 'ag-' + Date.now().toString(36),
              name: n.name.trim(),
              email: n.email.trim(),
              country: n.country.trim() || S.trip.country,
              city: n.city.trim(),
              plan: n.plan,
              status: 'pending',
            });
            log(`Admin added ${n.name.trim()} (pending approval).`, 'Admin');
            S.newAg = { name: '', email: '', country: '', city: '', plan: 'Membership · Monthly' };
            save();
            render();
            toast('Agency added');
            break;
          }
          case 'agapprove': {
            const a = S.agencies.find((x) => x.id === el.dataset.id);
            if (a) {
              a.status = 'active';
              log(`Admin approved ${a.name}.`, 'Admin');
              save();
              render();
              toast(a.name + ' approved');
            }
            break;
          }
          case 'agdecline': {
            const a = S.agencies.find((x) => x.id === el.dataset.id);
            if (a) {
              a.status = 'declined';
              log(`Admin declined ${a.name}.`, 'Admin');
              save();
              render();
              toast(a.name + ' declined');
            }
            break;
          }
          case 'agsuspend': {
            const a = S.agencies.find((x) => x.id === el.dataset.id);
            if (a) {
              a.status = 'suspended';
              log(`Admin suspended ${a.name}.`, 'Admin');
              save();
              render();
            }
            break;
          }
          case 'agactivate': {
            const a = S.agencies.find((x) => x.id === el.dataset.id);
            if (a) {
              a.status = 'active';
              log(`Admin reactivated ${a.name}.`, 'Admin');
              save();
              render();
            }
            break;
          }
          case 'agdelete': {
            if (el.dataset.id === 'me') {
              if (!confirm('Delete ' + ME + "'s account? Their registration and plan are removed."))
                return;
              S.plan.submitted = false;
              S.plan.approved = false;
              S.plan.accepted = false;
              S.plan.suspended = false;
              S.signedIn = false;
              log(`Admin deleted ${ME}'s account.`, 'Admin');
              save();
              render();
              toast('Agency deleted');
              return;
            }
            const a = S.agencies.find((x) => x.id === el.dataset.id);
            if (!a) return;
            if (!confirm('Delete ' + a.name + '? This cannot be undone.')) return;
            S.agencies = S.agencies.filter((x) => x.id !== a.id);
            log(`Admin deleted ${a.name}.`, 'Admin');
            save();
            render();
            toast('Agency deleted');
            break;
          }
          case 'approve':
            S.plan.approved = true;
            log(`Admin approved ${ME}.`, 'Admin');
            save();
            render();
            toast(ME + ' approved');
            break;
          case 'reject':
            S.plan.submitted = false;
            S.plan.accepted = false;
            log(`Admin rejected ${ME}'s application.`, 'Admin');
            save();
            render();
            break;
          case 'suspend':
            S.plan.suspended = !S.plan.suspended;
            log(`Admin ${S.plan.suspended ? 'suspended' : 'reactivated'} ${ME}.`, 'Admin');
            save();
            render();
            break;
          case 'commpaid':
            S.commissionPaid = true;
            log(
              `Admin recorded commission received from ${ME}. Membership active for one month.`,
              'Admin',
            );
            save();
            render();
