# Nginx Production Configuration Sample for Troublefree Holiday Platform

# Upstream Node.js Backend Server
upstream backend_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name troublefreeholiday.com *.troublefreeholiday.com;
    return 301 https://$host$request_uri;
}

# HTTPS Production Web Applications & API Router
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name troublefreeholiday.com *.troublefreeholiday.com;

    # TLS Certificates
    ssl_certificate /etc/letsencrypt/live/troublefreeholiday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/troublefreeholiday.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client Request Body Limits
    client_max_body_size 5M;

    # API Gateway Routes
    location /api/v1/ {
        proxy_pass http://backend_app/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO Real-time WebSockets
    location /socket.io/ {
        proxy_pass http://backend_app/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Traveller Frontend Web App (SPA Fallback)
    location / {
        root /var/www/troublefree/traveller;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Agency Frontend Web App
    location /agency {
        alias /var/www/troublefree/agency;
        index index.html;
        try_files $uri $uri/ /agency/index.html;
    }

    # Admin Frontend Web App
    location /admin {
        alias /var/www/troublefree/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
}
